<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Pack of Mint 🥬?</title>

    <!-- Open Graph stuff -->
    <meta property="og:title" content="A Pack of Mint 🥬?" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mintypack.dev/" />
    <meta property="og:image" content="https://mintypack.dev/images/og-hero.png" />
    <meta property="og:image:width" content="1731" />
    <meta property="og:image:height" content="909" />
    <meta property="og:description" content="Hi, I'm Zoe :)" />

    <!-- Twitter metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image:alt" content="Hi, I'm Zoe :)" />

    <!-- Apply persisted theme to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          let t = localStorage.getItem('webpage-theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', t === 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Don't have JS in 2026 hmmm?</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
